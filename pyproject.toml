[project]
name = "kjlc-rga-to-influxdb"
version = "0.1.0"
description = "KJLC RGA scan relay to InfluxDB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "influxdb-client>=1.50.0",
    "py-kjlc-rga",
]

[tool.uv.workspace]
members = [
    "py-kjlc-rga",
]

[tool.uv.sources]
py-kjlc-rga = { workspace = true, editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["py-kjlc-rga", "imaq-secret"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
