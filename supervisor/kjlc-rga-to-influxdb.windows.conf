; Copy this file unchanged into the Supervisor conf.d folder.
; The relay checkout is expected at
; %USERPROFILE%\Projects\kjlc-rga-to-influxdb.
[program:kjlc-rga-to-influxdb]
command="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "%(ENV_USERPROFILE)s\Projects\kjlc-rga-to-influxdb\Startup.ps1"
directory="%(ENV_USERPROFILE)s\Projects\kjlc-rga-to-influxdb"
process_name=%(program_name)s
autostart=false
startsecs=5
startretries=5
autorestart=unexpected
; Upper limit for blocking I/O and cleanup after interruption; adjust for deployment.
stopwaitsecs=3600
stdout_logfile=%(here)s\logs\%(program_name)s_out.log
stdout_logfile_maxbytes=2MB
stdout_logfile_backups=2
stderr_logfile=%(here)s\logs\%(program_name)s_err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
